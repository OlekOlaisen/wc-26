[build]
  command = "npm run build"
  publish = "dist"

# Same-origin proxy as Vite dev — avoids browser CORS to worldcup26.ir
[[redirects]]
  from = "/api/*"
  to = "https://worldcup26.ir/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-football/*"
  to = "/.netlify/functions/api-football/:splat"
  status = 200
  force = true
